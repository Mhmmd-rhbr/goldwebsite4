<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد مدیریت | زرین گالری</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --obsidian:      #0A0806;
      --charcoal:      #141210;
      --dark-brown:    #1C1812;
      --gold-pale:     #F5E6C8;
      --gold-cream:    #EDD59A;
      --gold-primary:  #C9912A;
      --gold-deep:     #A6741A;
      --ivory:         #FAF6F0;
      --muted:         #8A7A6A;
      --separator:     rgba(201, 145, 42, 0.15);
      --font-display:  'Cinzel Decorative', serif;
      --font-persian:  'Vazirmatn', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-persian);
      background: var(--obsidian);
      color: var(--ivory);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Sidebar Navigation */
    .admin-sidebar {
      width: 260px;
      background: var(--charcoal);
      border-left: 1px solid var(--separator);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .admin-logo {
      padding: 30px;
      font-family: var(--font-display);
      font-size: 2rem;
      color: var(--gold-primary);
      text-align: center;
      border-bottom: 1px solid var(--separator);
      letter-spacing: 0.1em;
    }
    .nav-menu {
      list-style: none;
      padding: 20px 0;
      flex: 1;
    }
    .nav-item {
      padding: 15px 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--gold-pale);
      display: block;
      text-decoration: none;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(201, 145, 42, 0.1);
      color: var(--gold-primary);
      border-right: 4px solid var(--gold-primary);
    }
    .logout-btn {
      padding: 20px 30px;
      border-top: 1px solid var(--separator);
      color: #ff5252;
      text-decoration: none;
      transition: background 0.3s;
    }
    .logout-btn:hover { background: rgba(255, 82, 82, 0.1); }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 40px 60px;
      background: linear-gradient(180deg, #0A0806 0%, #0F0D0A 100%);
    }
    .page-title {
      font-size: 2rem;
      color: var(--gold-cream);
      margin-bottom: 10px;
    }
    .page-subtitle {
      color: var(--muted);
      margin-bottom: 40px;
      font-size: 1rem;
    }

    /* Form Styles */
    .dashboard-form {
      background: var(--dark-brown);
      border: 1px solid var(--separator);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group.full-width {
      grid-column: span 2;
    }
    
    .form-label {
      color: var(--gold-pale);
      margin-bottom: 8px;
      font-size: 0.95rem;
    }
    
    .form-input, .form-select, .form-textarea {
      background: var(--charcoal);
      border: 1px solid var(--separator);
      padding: 12px 15px;
      color: var(--ivory);
      border-radius: 6px;
      font-family: var(--font-persian);
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--gold-primary);
    }
    
    .form-textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Image Dropzone */
    .dropzone {
      background: rgba(20, 18, 16, 0.5);
      border: 2px dashed var(--separator);
      border-radius: 8px;
      padding: 50px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .dropzone:hover {
      border-color: var(--gold-primary);
      background: rgba(201, 145, 42, 0.05);
    }
    .dropzone p { color: var(--muted); margin-top: 10px; }

    /* Final Price Display */
    .calc-box {
      background: rgba(201, 145, 42, 0.1);
      border: 1px solid var(--gold-deep);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
    .calc-label { color: var(--gold-cream); font-size: 1rem; margin-bottom: 5px; }
    .calc-value { color: var(--gold-primary); font-size: 2rem; font-weight: bold; }

    .submit-btn {
      background: var(--gold-primary);
      color: var(--obsidian);
      padding: 15px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover { background: var(--gold-cream); }

  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="admin-logo">ZARRIN</div>
    <ul class="nav-menu">
      <li><a href="#" class="nav-item">داشبورد</a></li>
      <li><a href="#" class="nav-item active">افزودن محصول جدید</a></li>
      <li><a href="#" class="nav-item">مدیریت محصولات</a></li>
      <li><a href="#" class="nav-item">سفارشات</a></li>
      <li><a href="#" class="nav-item">تنظیمات گالری</a></li>
    </ul>
    <a href="admin-login.html" class="logout-btn">خروج از حساب</a>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <h1 class="page-title">افزودن پست محصول</h1>
    <p class="page-subtitle">اطلاعات قطعه طلای جدید را برای نمایش در سایت وارد کنید.</p>

    <form class="dashboard-form">
      
      <!-- General Info -->
      <div class="form-group">
        <label class="form-label">نام محصول</label>
        <input type="text" id="productTitle" class="form-input" placeholder="مثال: انگشتر الماس باغ ایران" required>
      </div>
      
      <div class="form-group">
        <label class="form-label">دسته بندی</label>
        <select id="productCategory" class="form-select" required>
          <option value="ring">انگشتر</option>
          <option value="necklace">گردنبند</option>
          <option value="bracelet">دستبند</option>
          <option value="earring">گوشواره</option>
          <option value="set">سرویس کامل</option>
        </select>
      </div>

      <!-- Specs & Price Variables -->
      <div class="form-group">
        <label class="form-label">عیار طلا</label>
        <select class="form-select" id="karat" required>
          <option value="18">۱۸ عیار</option>
          <option value="21">۲۱ عیار</option>
          <option value="22">۲۲ عیار</option>
          <option value="24">۲۴ عیار</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">مظنه طلا (هر گرم به تومان)</label>
        <input type="number" id="goldPrice" class="form-input" value="4500000" oninput="calculatePrice()">
      </div>

      <div class="form-group">
        <label class="form-label">وزن قطعه (گرم)</label>
        <input type="number" step="0.01" id="weight" class="form-input" placeholder="مثال: 5.2" oninput="calculatePrice()" required>
      </div>

      <div class="form-group">
        <label class="form-label">اجرت ساخت (تومان به ازای هر گرم)</label>
        <input type="number" id="wage" class="form-input" placeholder="مثال: 600000" value="600000" oninput="calculatePrice()">
      </div>
      
      <div class="form-group">
        <label class="form-label">سود و مالیات (%)</label>
        <input type="number" id="tax" class="form-input" value="16" oninput="calculatePrice()">
      </div>

      <!-- Resulting Price -->
      <div class="form-group calc-box">
        <div class="calc-label">قیمت نهایی محاسبه شده</div>
        <div class="calc-value" id="finalPriceDisplay">۰ تومان</div>
      </div>

      <!-- Upload Image -->
      <div class="form-group full-width">
        <label class="form-label">تصویر محصول</label>
        <input type="file" id="productImage" accept="image/*" style="display: none;" onchange="updateDropzoneText()">
        <div class="dropzone" id="dropzoneBox" onclick="document.getElementById('productImage').click()">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--gold-primary)" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
          </svg>
          <p id="dropzoneText">برای آپلود تصویر کلیک کنید یا عکس را اینجا بکشید.</p>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label class="form-label">توضیحات و داستان قطعه</label>
        <textarea class="form-textarea" placeholder="متن توضیحی، ویژگی‌های خاص طراحی و تاریخچه الهام این قطعه..." required></textarea>
      </div>

      <div class="form-group full-width">
        <button type="button" class="submit-btn" onclick="submitProduct()">انتشار محصول در وبسایت</button>
      </div>

    </form>
  </main>

  <script>
    // Route Protection
    if (sessionStorage.getItem('isAdmin') !== 'true') {
      window.location.href = 'admin-login.html';
    }

    let currentBase64Image = null;

    function updateDropzoneText() {
      const fileInput = document.getElementById('productImage');
      const dropzoneText = document.getElementById('dropzoneText');
      if (fileInput.files && fileInput.files[0]) {
        dropzoneText.innerText = fileInput.files[0].name;
        
        // Convert to Base64 to save in LocalStorage
        const reader = new FileReader();
        reader.onload = function(e) {
          currentBase64Image = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }

    function calculatePrice() {
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const goldPrice = parseFloat(document.getElementById('goldPrice').value) || 0;
      const wage = parseFloat(document.getElementById('wage').value) || 0;
      const taxPercent = parseFloat(document.getElementById('tax').value) || 0;

      // Basic formula: Weight * (GoldPrice + Wage) * (1 + Tax/100)
      const baseCost = weight * (goldPrice + wage);
      const finalCost = baseCost + (baseCost * (taxPercent / 100));
      
      const formattedToman = Math.round(finalCost).toLocaleString('fa-IR');
      document.getElementById('finalPriceDisplay').innerText = formattedToman + ' تومان';
      return Math.round(finalCost);
    }

    function submitProduct() {
      const title = document.getElementById('productTitle').value;
      const category = document.getElementById('productCategory').value;
      const karat = document.getElementById('karat').value;
      const weight = document.getElementById('weight').value;
      const finalPrice = calculatePrice();

      if (!title || !weight) {
        alert('لطفا نام و وزن محصول را وارد کنید.');
        return;
      }

      const newProduct = {
        id: 'ZG-' + Math.floor(Math.random() * 10000),
        title: title,
        category: category,
        karat: karat,
        weight: weight,
        price: finalPrice,
        image: currentBase64Image || 'media/placeholder-jewelry.jpg',
        date: new Date().toISOString()
      };

      // Retrieve existing products from LocalStorage
      let products = JSON.parse(localStorage.getItem('zarrin_products')) || [];
      products.push(newProduct);
      
      // Save back to LocalStorage
      localStorage.setItem('zarrin_products', JSON.stringify(products));

      alert('محصول با موفقیت اضافه شد!');
      document.querySelector('.dashboard-form').reset();
      document.getElementById('dropzoneText').innerText = 'برای آپلود تصویر کلیک کنید یا عکس را اینجا بکشید.';
      currentBase64Image = null;
      calculatePrice();
    }
  </script>
</body>
</html>
